<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <clipPath id="circle">
      <circle cx="80" cy="80" r="68"/>
    </clipPath>

    <mask id="lines">
      <rect width="160" height="160" fill="black"/>
      <g clip-path="url(#circle)" transform="rotate(45, 80, 80)">
        <line x1="-20" y1="17"  x2="180" y2="17"  stroke="white" stroke-width="16"/>
        <line x1="-20" y1="38"  x2="180" y2="38"  stroke="white" stroke-width="16"/>
        <line x1="-20" y1="59"  x2="180" y2="59"  stroke="white" stroke-width="16"/>
        <line x1="-20" y1="80"  x2="180" y2="80"  stroke="white" stroke-width="16"/>
        <line x1="-20" y1="101" x2="180" y2="101" stroke="white" stroke-width="16"/>
        <line x1="-20" y1="122" x2="180" y2="122" stroke="white" stroke-width="16"/>
        <line x1="-20" y1="143" x2="180" y2="143" stroke="white" stroke-width="16"/>
      </g>
    </mask>

    <linearGradient id="grad" x1="0" y1="12" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE4B8"/>
      <stop offset="35%"  stop-color="#F09040"/>
      <stop offset="70%"  stop-color="#D05A10"/>
      <stop offset="100%" stop-color="#C84810"/>
    </linearGradient>
  </defs>

  <rect width="160" height="160" fill="url(#grad)" mask="url(#lines)"/>
</svg>
